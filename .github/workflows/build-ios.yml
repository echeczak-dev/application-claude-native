name: Build iOS Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Resolve Swift Package deps
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: Build unsigned archive
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned .ipa
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr ApplicationClaude-unsigned.ipa Payload
          ls -lh ApplicationClaude-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApplicationClaude-unsigned-ipa
          path: ios/App/ApplicationClaude-unsigned.ipa
          retention-days: 30

      # ---------- Autonomous visual verification in iOS Simulator ----------
      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath sim_build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot iPhone 15 Pro simulator
        run: |
          xcrun simctl list devices available | head -20
          UDID=$(xcrun simctl create claude-test "iPhone 15 Pro" "com.apple.CoreSimulator.SimRuntime.iOS-17-5" 2>/dev/null || xcrun simctl list devices | grep "iPhone 15 Pro" | grep -oE "[0-9A-F-]{36}" | head -1)
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install + launch app in simulator
        run: |
          APP_PATH=$(find ios/App/sim_build/Build/Products -name "App.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" app.claude.applicationclaude
          # Wait for webview to load the Netlify URL
          sleep 20

      - name: Screenshot simulator (proof of fullscreen)
        run: |
          xcrun simctl io "$UDID" screenshot sim_shot.png
          ls -lh sim_shot.png

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot-proof
          path: sim_shot.png
          retention-days: 30
